  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="N+T Catering — përvoja catering-u të kuruara me kujdes, ku kuzhina e rafinuar dhe eleganca e përjetshme bashkohen."
    />
    <title>N+T Catering</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <noscript>
      <style>
        .hero,
        .navbar__bar {
          opacity: 1 !important;
        }
        .hero__media {
          clip-path: none !important;
        }
        .hero__media img {
          transform: none !important;
          filter: none !important;

        .hero__intro,
        .hero__copy,
        .hero__actions,
        .hero__scroll-inner,
        .philosophy__line span,
        .philosophy__book,
        .philosophy__note {
          transform: none !important;
          opacity: 1 !important;
          visibility: visible !important;
        }
        .philosophy__thumb,
        .philosophy__frame {
          clip-path: none !important;
        }
        .philosophy__thumb img,
        .philosophy__frame img,
        .philosophy__media {
          transform: none !important;
        }
      </style>
    </noscript>
